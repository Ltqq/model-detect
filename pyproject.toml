[project]
name = "model-detect"
version = "0.2.0"
description = "Black-box LLM API authenticity, protocol and capability audit toolkit"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
model-detect = "model_detect.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_detect*"]

[tool.setuptools.package-data]
model_detect = [
  "data/*.yaml",
  "data/models/*.yaml",
  "templates/*.html"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
