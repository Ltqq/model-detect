target:
  base_url: https://example.com/v1
  model: kimi-k3
  api_key_env: MODEL_DETECT_API_KEY
  protocol: openai
  timeout_seconds: 30

# quick / standard / deep
profile: standard

output_dir: model-detect-output

# 可选：使用 Reference Registry
# reference_id: kimi-k3-official
reference_dir: references

# 可选：直接指定 llm-fingerprint reference JSON
# fingerprint_reference: references/kimi-k3-official/fingerprint.json

# 可选：声明模型上下文窗口，Deep Context Needle 不会超过它
# declared_context_tokens: 32768

capability_enabled: true
proxy_sleuth_enabled: true

extra_headers: {}
