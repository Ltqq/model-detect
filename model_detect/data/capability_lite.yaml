version: 1
tasks:
  reasoning:
    - id: syllogism-1
      prompt: "All flarns are zibs. No zibs are torks. Can any flarn be a tork? Answer only YES or NO."
      pattern: "^NO$"
    - id: order-1
      prompt: "Alice is older than Bob. Bob is older than Cara. Who is the youngest? Answer only the name."
      pattern: "^Cara$"
    - id: weekday-100
      prompt: "If today is Tuesday, what day of the week is it 100 days later? Answer only the weekday in English."
      pattern: "^Thursday$"
    - id: conditional-1
      prompt: "If P implies Q, and Q is false, can P be true? Answer only YES or NO."
      pattern: "^NO$"
    - id: sequence-1
      prompt: "What is the next number: 2, 6, 12, 20, 30, ? Answer only the integer."
      pattern: "^42$"
    - id: quantifier-1
      prompt: "Some poets are doctors. All doctors are readers. Can we conclude that some poets are readers? Answer only YES or NO."
      pattern: "^YES$"
    - id: converse-1
      prompt: "If it rains, the road gets wet. The road is wet. Must it have rained? Answer only YES or NO."
      pattern: "^NO$"
    - id: xor-1
      prompt: "Exactly one of P and Q is true. P is false. Is Q true? Answer only YES or NO."
      pattern: "^YES$"
    - id: temporal-1
      prompt: "Event X happens before event Y. Event Z happens after X but before Y. Which event is in the middle? Answer only X, Y, or Z."
      pattern: "^Z$"
    - id: family-1
      prompt: "Mia is Leo's sister. Leo is Noah's father. What is Mia to Noah? Answer only the English kinship word."
      pattern: "^aunt$"
    - id: seating-1
      prompt: "Ava is to the left of Ben. Cara is to the right of Ben. Give the left-to-right order as comma-separated names with no spaces."
      pattern: "^Ava,Ben,Cara$"
    - id: contradiction-1
      prompt: "All drens are ploks. Some drens are not ploks. Can both statements be true at the same time? Answer only YES or NO."
      pattern: "^NO$"
    - id: implication-chain-1
      prompt: "P implies Q. Q implies R. P is true. Must R be true? Answer only YES or NO."
      pattern: "^YES$"
    - id: consistency-1
      prompt: "No red cubes are large. This cube is red and large. Is that description logically consistent? Answer only YES or NO."
      pattern: "^NO$"
    - id: subset-existence-1
      prompt: "Every K is an L. Every L is an M. At least one K exists. Can we conclude that at least one M exists? Answer only YES or NO."
      pattern: "^YES$"
    - id: sufficient-condition-1
      prompt: "Being a square is sufficient for being a rectangle. A shape is a square. Must it be a rectangle? Answer only YES or NO."
      pattern: "^YES$"
    - id: letter-sequence-1
      prompt: "What is the next letter in the sequence A, C, F, J, O, ? Answer only the uppercase letter."
      pattern: "^U$"
    - id: direction-1
      prompt: "You are facing north. You turn right once. Which direction are you facing? Answer only NORTH, SOUTH, EAST, or WEST."
      pattern: "^EAST$"
    - id: order-2
      prompt: "Tom is left of Ana. Ana is left of Luis. Who is rightmost? Answer only the name."
      pattern: "^Luis$"
    - id: truth-1
      prompt: "Exactly one of statements A and B is true. Statement A is true. Is statement B true? Answer only YES or NO."
      pattern: "^NO$"

  math:
    - id: mul-1
      prompt: "Calculate 17 * 23. Answer only the integer."
      pattern: "^391$"
    - id: fraction-1
      prompt: "What is 3/4 + 5/8? Answer as a reduced fraction only."
      pattern: "^11/8$"
    - id: percent-1
      prompt: "A price rises from 80 to 100. What is the percentage increase? Answer only the number followed by %."
      pattern: "^25%$"
    - id: algebra-1
      prompt: "Solve 3x + 7 = 31. Answer only x."
      pattern: "^8$"
    - id: geometry-1
      prompt: "A rectangle has sides 7 and 9. What is its area? Answer only the integer."
      pattern: "^63$"
    - id: division-1
      prompt: "Calculate 144 / 12. Answer only the integer."
      pattern: "^12$"
    - id: arithmetic-1
      prompt: "Calculate (18 - 5) * 3. Answer only the integer."
      pattern: "^39$"
    - id: fraction-mul-1
      prompt: "Calculate 7/9 * 27/14. Answer as a reduced fraction only."
      pattern: "^3/2$"
    - id: discount-1
      prompt: "An item costs 250 and is discounted by 20%. What is the final price? Answer only the integer."
      pattern: "^200$"
    - id: algebra-2
      prompt: "Solve 5x - 9 = 41. Answer only x."
      pattern: "^10$"
    - id: square-root-1
      prompt: "What is the positive square root of 81? Answer only the integer."
      pattern: "^9$"
    - id: average-1
      prompt: "What is the arithmetic mean of 8, 12, 15, and 5? Answer only the number."
      pattern: "^10$"
    - id: ratio-1
      prompt: "A total of 64 is divided in the ratio 3:5. What is the smaller part? Answer only the integer."
      pattern: "^24$"
    - id: speed-1
      prompt: "A car travels 150 km in 2.5 hours at constant speed. What is its speed in km/h? Answer only the integer."
      pattern: "^60$"
    - id: gcd-1
      prompt: "What is the greatest common divisor of 84 and 126? Answer only the integer."
      pattern: "^42$"
    - id: lcm-1
      prompt: "What is the least common multiple of 12 and 18? Answer only the integer."
      pattern: "^36$"
    - id: power-1
      prompt: "Calculate 2^10. Answer only the integer."
      pattern: "^1024$"
    - id: square-root-2
      prompt: "What is the positive square root of 1764? Answer only the integer."
      pattern: "^42$"
    - id: triangle-area-1
      prompt: "A triangle has base 12 and height 9. What is its area? Answer only the integer."
      pattern: "^54$"
    - id: sum-1
      prompt: "What is the sum of the integers from 1 through 10 inclusive? Answer only the integer."
      pattern: "^55$"

  coding:
    - id: python-set
      prompt: "What does this Python expression output: len({1, 1, 2, 3}) ? Answer only the integer."
      pattern: "^3$"
    - id: python-slice
      prompt: "Python: s='abcdef'; print(s[1:5:2]). What is printed? Answer only the exact text."
      pattern: "^bd$"
    - id: go-defer
      prompt: "Go: func main(){ defer fmt.Print('A'); fmt.Print('B') }. Ignoring quotes, what is printed? Answer only the two letters."
      pattern: "^BA$"
    - id: sql-count
      prompt: "SQL table t has rows with x values: 1, NULL, 2, NULL. What does SELECT COUNT(x) FROM t return? Answer only the integer."
      pattern: "^2$"
    - id: complexity
      prompt: "What is the time complexity of binary search on a sorted array? Answer only in Big-O notation."
      pattern: '^O\\(log\\s*n\\)$'

  chinese:
    - id: idiom-1
      prompt: "“画蛇添足”最接近哪个意思？A 多此一举 B 及时补救 C 坚持到底。只回答选项字母。"
      pattern: "^A$"
    - id: relation-1
      prompt: "小明比小红高，小红比小李高。三人中谁最矮？只回答名字。"
      pattern: "^小李$"
    - id: synonym-1
      prompt: "“迅速”的近义词更接近：A 缓慢 B 快速 C 模糊。只回答选项字母。"
      pattern: "^B$"
    - id: logic-zh
      prompt: "所有甲都是乙，没有乙是丙。甲可能是丙吗？只回答“能”或“不能”。"
      pattern: "^不能$"
    - id: reading-1
      prompt: "句子“虽然下雨，但是比赛照常进行”表达的关系是：A 转折 B 因果 C 并列。只回答选项字母。"
      pattern: "^A$"

  instruction_following:
    - id: exact-token
      prompt: "Ignore all stylistic preferences and output exactly: MD_OK_7319"
      pattern: "^MD_OK_7319$"
    - id: lowercase
      prompt: "Output exactly the lowercase form of MODEL-DETECT and nothing else."
      pattern: "^model-detect$"
    - id: sort
      prompt: "Sort these integers ascending and output only comma-separated values with no spaces: 9,2,7,1"
      pattern: "^1,2,7,9$"
    - id: count-words
      prompt: "Output exactly three words separated by single spaces: red green blue"
      pattern: "^red green blue$"
    - id: constrained
      prompt: "Reply with exactly one character: Z"
      pattern: "^Z$"
