notes:
  - "GLM-5.2 official materials document a 1M-token context."
  - "The official open-weight model accepts high/max reasoning_effort and defaults to max; values other than explicit high fall back to max in the official chat template."
  - "The official repository publishes separate BF16 and FP8 checkpoints. Black-box API behavior cannot reliably identify which checkpoint a provider serves."
  - "Thinking-disable behavior is not asserted for third-party OpenAI-compatible gateways until a first-party API contract is attached."
  - "The rule is non-strict because gateway/provider behavior can differ from the first-party endpoint."
