schema_version: 3

id: qwen3.8
family: qwen
model_version: "3.8"
patterns:
  - "qwen3.8-*"
aliases: []
updated_at: "2026-10-08"

sources:
  - id: alibaba-qwen-chat-reasoning
    type: official_doc
    title: "Alibaba Cloud Model Studio - Qwen via OpenAI Chat Completions"
    url: "https://help.aliyun.com/en/model-studio/qwen-api-via-openai-chat-completions"
    collected_at: "2026-10-08"
    confidence: high

  - id: alibaba-qwen-responses-reasoning
    type: official_doc
    title: "Alibaba Cloud Model Studio - Qwen via OpenAI Responses API"
    url: "https://help.aliyun.com/en/model-studio/qwen-api-via-openai-responses"
    collected_at: "2026-10-08"
    confidence: high

strict: false

features:
  reasoning_effort:
    expected: true
    source_refs:
      - alibaba-qwen-chat-reasoning
      - alibaba-qwen-responses-reasoning

  disable_thinking:
    expected: true
    source_refs:
      - alibaba-qwen-chat-reasoning
      - alibaba-qwen-responses-reasoning

  tools:
    expected: true
    source_refs:
      - alibaba-qwen-chat-reasoning
      - alibaba-qwen-responses-reasoning

  json_schema:
    expected: null

protocol_features:
  chat_completions:
    reasoning_effort:
      values: [none, low, medium, xhigh]
      default: xhigh
      native_parameter: reasoning_effort
      mappings:
        minimal: low
        high: xhigh
        max: xhigh
      source_refs:
        - alibaba-qwen-chat-reasoning

    disable_thinking:
      expected: true
      mechanisms:
        - "reasoning_effort=none"
        - "enable_thinking=false"
      source_refs:
        - alibaba-qwen-chat-reasoning

  responses:
    reasoning_effort:
      values: [none, low, medium, xhigh]
      default: xhigh
      native_parameter: reasoning.effort
      mappings:
        minimal: low
        high: xhigh
        max: xhigh
      source_refs:
        - alibaba-qwen-responses-reasoning

    disable_thinking:
      expected: true
      mechanisms:
        - "reasoning.effort=none"
        - "enable_thinking=false"
      source_refs:
        - alibaba-qwen-responses-reasoning

notes:
  - "Qwen3.8 supports low/medium/xhigh native reasoning tiers; minimal maps to low and high/max map to xhigh."
  - "none disables thinking; enable_thinking remains supported but reasoning effort is the recommended control."
  - "Chat Completions and Responses use different parameter shapes and are represented separately."
  - "The rule is non-strict because third-party gateways may normalize or map reasoning parameters."
