strict: false

features:
  reasoning_effort:
    expected: true
    values: [low, high, max]
    default: max
    source_refs:
      - moonshot-kimi-k3-readme
      - kimi-api-troubleshooting

  disable_thinking:
    expected: false
    source_refs:
      - moonshot-kimi-k3-readme
      - kimi-api-troubleshooting

  tools:
    expected: null

  json_schema:
    expected: null

notes:
  - "Kimi K3 always has thinking enabled; use reasoning_effort instead of disabling thinking."
  - "Current official reasoning_effort values are low, high, and max; max is the default."
  - "This rule is intentionally non-strict: provider/gateway behavior can differ from the official endpoint."
  - "Empirical supplier observations are registered separately and should only become expected features after stored Evidence supports them."
