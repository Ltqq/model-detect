  tools:
    expected: true
    source_refs:
      - moonshot-kimi-k3-readme
      - kimi-api-troubleshooting

  json_schema:
    expected: null

protocol_features:
  chat_completions:
    reasoning_effort:
      values: [low, high, max]
      default: max
      native_parameter: reasoning_effort
      source_refs:
        - moonshot-kimi-k3-readme
        - kimi-api-troubleshooting

    disable_thinking:
      expected: false
      source_refs:
        - moonshot-kimi-k3-readme
        - kimi-api-troubleshooting

notes:
  - "Kimi K3 always has thinking enabled; use reasoning_effort instead of disabling thinking."
  - "Kimi K3 official API supports a 1,048,576-token context window."
  - "The official open-weight Kimi K3 uses native MXFP4 weights with MXFP8 activations trained with quantization-aware training; this is an implementation fact, not a black-box quantization detector."
  - "Tool calls are documented by the official API and preserved-thinking history must retain reasoning_content and tool_calls."
  - "This rule is intentionally non-strict: provider/gateway behavior can differ from the official endpoint."
