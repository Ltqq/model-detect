schema_version: 2

id: kimi-k3
family: kimi
model_version: k3
patterns:
  - "kimi-k3"
  - "kimi-k3-*"
aliases:
  - "Kimi-K3"
updated_at: "2026-09-30"

sources:
  - id: moonshot-kimi-k3-readme
    type: official_doc
    title: "MoonshotAI Kimi-K3 model usage"
    url: "https://github.com/MoonshotAI/Kimi-K3/blob/main/README.md"
    collected_at: "2026-09-30"
    confidence: high

  - id: kimi-api-troubleshooting
    type: official_doc
    title: "Kimi API troubleshooting"
    url: "https://www.kimi.ai/help/kimi-api/api-troubleshooting"
    collected_at: "2026-09-30"
    confidence: high

  - id: model-detect-kimi-k3-provider-observations
    type: empirical
    title: "model-detect Kimi-K3 supplier regression observations"
    collected_at: "2026-09-30"
