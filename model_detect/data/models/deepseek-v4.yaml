schema_version: 2

id: deepseek-v4
family: deepseek
model_version: "v4"
patterns:
  - "deepseek-v4-*"
  - "deepseek-v4.1-*"
  - "deepseek-flash"
aliases: []
updated_at: "2026-09-30"

sources:
  - id: deepseek-thinking-mode
    type: official_doc
    title: "DeepSeek API - Thinking Mode"
    url: "https://api-docs.deepseek.com/guides/thinking_mode/"
    collected_at: "2026-09-30"
    confidence: high

  - id: deepseek-chat-completions
    type: official_doc
    title: "DeepSeek API - Chat Completions"
    url: "https://api-docs.deepseek.com/api/create-chat-completion/"
    collected_at: "2026-09-30"
    confidence: high

  - id: deepseek-v4-changelog
    type: official_doc
    title: "DeepSeek API - V4 change log"
    url: "https://api-docs.deepseek.com/updates/"
    collected_at: "2026-09-30"
    confidence: high

strict: false

features:
  reasoning_effort:
    expected: true
    values: [none, low, high, max]
    default: high
    mappings:
      minimal: low
      medium: high
      xhigh: high
      ultra: max
    source_refs:
      - deepseek-thinking-mode
      - deepseek-chat-completions
      - deepseek-v4-changelog

  disable_thinking:
    expected: true
    mechanisms:
      - "thinking.type=disabled"
      - "reasoning_effort=none"
    source_refs:
      - deepseek-thinking-mode
      - deepseek-chat-completions

  tools:
    expected: true
    source_refs:
      - deepseek-thinking-mode
      - deepseek-chat-completions

  json_schema:
    expected: null

notes:
  - "DeepSeek V4-family thinking is enabled by default and can be disabled explicitly."
  - "Thinking-mode tool calls require preserving reasoning_content across tool-call turns."
  - "The current rule intentionally does not claim JSON Schema support from JSON-object mode documentation."
  - "Empirical gateway observations must be stored separately as empirical sources before changing official expectations."
  - "The rule is non-strict because third-party gateways may transform request parameters or response fields."
