name: CI

on:
  push:
    branches: [main, feature/core-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest

      - name: Compile
        run: python -m compileall -q model_detect

      - name: CLI smoke test
        run: |
          model-detect version
          model-detect oss-status
          model-detect reference --help
          model-detect web --help
          model-detect compare --help
          python -m model_detect version

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              names = set(z.namelist())
          required = {
              "model_detect/data/providers.yaml",
              "model_detect/data/capability_lite.yaml",
              "model_detect/data/models/default.yaml",
              "model_detect/data/models/kimi-k3.yaml",
              "model_detect/templates/index.html",
              "model_detect/templates/references.html",
          }
          missing = sorted(required - names)
          assert not missing, f"missing package data: {missing}"
          print("wheel package data OK")
          PY
