name: CI

on:
  push:
    branches: [main, feature/core-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest

      - name: Compile
        run: python -m compileall -q model_detect

      - name: CLI smoke test
        run: |
          model-detect version
          model-detect oss-status
          model-detect reference --help
          model-detect glm53 compare --help
          model-detect glm53 replay --help
          model-detect glm53 doctor --help
          model-detect web --help
          model-detect compare --help
          python -m model_detect version

      - name: Offline handoff acceptance self-check (no model API)
        run: python scripts/acceptance_check.py

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              names = set(z.namelist())
          required = {
              "model_detect/data/providers.yaml",
              "model_detect/data/capability_lite.yaml",
              "model_detect/data/models/default.yaml",
              "model_detect/data/models/kimi-k3.yaml",
              "model_detect/data/models/glm-5.3.yaml",
              "model_detect/data/models/glm-5.3-flash.yaml",
              "model_detect/data/models/deepseek-v4.yaml",
              "model_detect/data/models/deepseek-v4.1.yaml",
              "model_detect/data/public_benchmarks.yaml",
              "model_detect/templates/index.html",
              "model_detect/templates/references.html",
          }
          missing = sorted(required - names)
          assert not missing, f"missing package data: {missing}"
          print("wheel package data OK")
          PY

      - name: R1 installed wheel smoke (outside checkout, no paid API)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/model-detect-installed"
          "$RUNNER_TEMP/model-detect-installed/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/model-detect-installed/bin/model-detect" version
          "$RUNNER_TEMP/model-detect-installed/bin/model-detect" web --help
          "$RUNNER_TEMP/model-detect-installed/bin/model-detect" reference --help
          "$RUNNER_TEMP/model-detect-installed/bin/python" - <<'PY'
          from importlib.resources import files
          import model_detect
          root = files("model_detect")
          for path in (
              "templates/index.html", "templates/references.html",
              "data/providers.yaml", "data/public_benchmarks.yaml",
              "data/models/glm-5.3.yaml", "data/models/glm-5.3-flash.yaml",
              "data/models/kimi-k3.yaml", "data/models/deepseek-v4.yaml",
              "data/models/deepseek-v4.1.yaml",
          ):
              assert root.joinpath(path).is_file(), f"wheel missing runtime asset: {path}"
          print("installed wheel CLI and runtime assets OK")
          PY
