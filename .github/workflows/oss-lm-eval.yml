name: Original OSS lm-eval contract
on:
  pull_request:
    branches: [main]
    paths:
      - "model_detect/adapters/lm_eval.py"
      - "model_detect/data/lm_eval_profiles.yaml"
      - ".github/workflows/oss-lm-eval.yml"
      - "tests/test_lm_eval_adapter.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and original upstream API engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "lm_eval[api]==0.4.13"
      - name: Check original upstream installed version and CLI
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from model_detect.adapters import lm_eval
          assert version("lm-eval") == "0.4.13"
          binary = lm_eval.resolve_lm_eval_executable()
          assert binary and lm_eval.availability()["available"]
          print("original EleutherAI CLI installed", version("lm-eval"))
          PY
          lm_eval --help >/dev/null
      - name: Validate adapter command using real original binary (zero API calls)
        run: |
          python - <<'PY'
          from tempfile import TemporaryDirectory
          from model_detect.adapters.lm_eval import build_command
          with TemporaryDirectory() as output:
              cmd = build_command(base_url="http://127.0.0.1:8765/v1", model="glm-5.3", tasks=["gsm8k"], output_path=output, limit=1)
              assert "--apply_chat_template" in cmd
              assert "local-chat-completions" in cmd
              print("Pinned upstream CLI interface/adapter build validated; no model calls")
          PY
      - name: Run original upstream task/scorer against local mock API (zero vendor calls)
        run: python scripts/oss_lm_eval_loopback_smoke.py
